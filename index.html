<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Division Login Page</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-[#000e25] via-[#1e3a8a] to-[#5D69F6] min-h-screen flex items-center justify-center">
<div class="bg-white w-full max-w-md rounded-3xl shadow-2xl p-10">
    <div class="flex justify-center mb-6">
        <img src="images/Footerlogo.png" class="h-20">
    </div>
    <form id="loginForm">
        <div class="mb-5">
            <label class="block mb-2 font-medium">Email</label>
            <input id="email" type="email" placeholder="Enter email" class="w-full border rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500" required>
        </div>
        <div class="mb-6">
            <label class="block mb-2 font-medium">Password</label>
            <input id="password" type="password" placeholder="Enter password" class="w-full border rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500" required>
        </div>
        <p id="error" class="text-red-500 text-sm mb-4 hidden"> </p>
        <button type="submit" class="w-full bg-[#000e25] text-white py-3 rounded-xl font-semibold hover:bg-[#1a2d66] transition"> 
            Login
        </button>
    </form>
</div>
<script>
const loginForm=document.getElementById("loginForm");
loginForm.addEventListener("submit",function(e){
    e.preventDefault();
    const email=document.getElementById("email").value.trim();
    const password=document.getElementById("password").value.trim();
    if(email==="admin@gmail.com" && password==="12345")
    {
        localStorage.setItem("loggedIn","true");

        window.location.href="Dashboard.html";
    }else{
        const error=document.getElementById("error");
        error.innerHTML="Invalid Email or Password";
        error.classList.remove("hidden");
    }
});
</script>
</body>
</html>
